<div class="auth-container">
  <div class="auth-card">
    <div class="profile-header">
      <h2>Новый пароль</h2>
      <p>Придумайте сложный пароль для вашего аккаунта</p>
    </div>

    <div class="profile-form">
      <div class="info-item" *ngIf="!token()">
        <p class="error-text">Токен отсутствует. Пожалуйста, перейдите по ссылке из письма.</p>
      </div>

      <div class="info-item">
        <label>Новый пароль</label>
        <input 
          type="password" 
          [ngModel]="newPassword()" 
          (ngModelChange)="newPassword.set($event)" 
          name="newPassword"
          required 
          placeholder="Минимум 6 символов"
        />
      </div>

      <div class="button-group">
        <button 
          class="save-btn" 
          (click)="resetpassword()" 
          [disabled]="!token() || newPassword().length < 6 || isLoading()"
        >
          {{ isLoading() ? 'Обновление...' : 'Обновить пароль' }}
        </button>
        <button class="logout-btn" (click)="router.navigate(['/login'])">Отмена</button>
      </div>
    </div>
  </div>
</div>
