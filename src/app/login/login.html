<div class="login-container">
  <div class="login-card">
    <h2>Sign In</h2>
    <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="Enter your email"
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          placeholder="Enter your password"
        />
      </div>
      <button type="submit" [disabled]="loginForm.invalid" class="login-btn">Sign In</button>
    </form>
    <p class="forgot-password" (click)="forgotpassword()">Forgot Password?</p>
    <a routerLink="/signin" class="signup-link">Don't have an account? Sign Up</a>
  </div>
</div>
