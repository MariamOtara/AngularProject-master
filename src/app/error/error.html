<section class="error-page">
  <div class="error-card">
    <div class="error-illustration" aria-hidden="true">
      <span class="digit">4</span>
      <span class="digit zero">0</span>
      <span class="digit">4</span>
    </div>

    <div class="error-content">
      <span class="eyebrow">Page not found</span>
      <h1>Oops! We couldn’t find that page.</h1>
      <p>
        The page you’re looking for may have moved, been removed, or never existed.
        Let’s get you back to our menu or homepage.
      </p>

      <div class="actions">
        <button routerLink="/home">Go to Home</button>
        <a class="button-link" routerLink="/menue">Browse Menu</a>
      </div>
    </div>
  </div>
</section>
